name: Deploy Jekyll site

# This is the workflow that actually builds and publishes your site.
# It was missing from the repo, which is why nothing has deployed since
# run #63 — no workflow file, no build, no matter how many times you push.
#
# It also generates the code-viewer JSON as a build step (instead of a
# separate workflow that commits back to the repo), so there's no
# dependency on a bot-authored commit re-triggering anything.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate project code-viewer data
        run: |
          python3 tools/generate_project_tree.py project-sources/minecraft-plugin minecraft-plugin
          # Add more lines here as you add more code-viewer-enabled projects:
          # python3 tools/generate_project_tree.py project-sources/<folder> <slug>

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
