name: Deploy Jekyll site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Generate plugin file manifest
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          data_dir = Path("_data")
          data_dir.mkdir(parents=True, exist_ok=True)

          root = Path("plugins")
          lines = []

          if root.is_dir():
              for plugin_dir in sorted(p for p in root.iterdir() if p.is_dir()):
                  files_dir = plugin_dir / "files"
                  if not files_dir.is_dir():
                      continue

                  lines.append(f"{plugin_dir.name}:")
                  for file in sorted(p for p in files_dir.rglob("*") if p.is_file()):
                      relative = file.relative_to(files_dir).as_posix()
                      url = "/" + file.as_posix()

                      def q(value):
                          return "'" + value.replace("'", "''") + "'"

                      lines.append(f"  - path: {q(relative)}")
                      lines.append(f"    url: {q(url)}")

          (data_dir / "plugin_files.yml").write_text(
              "\n".join(lines) + ("\n" if lines else ""),
              encoding="utf-8"
          )
          PY

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
