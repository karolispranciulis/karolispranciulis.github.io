<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | Karolis Pranciulis</title>
  <style>
    :root { --bg:#08111b; --panel:#0d1824; --panel2:#111f2d; --border:#23384b; --text:#e9f1f8; --muted:#91a5b7; --accent:#7dd3fc; }
    * { box-sizing:border-box; }
    body { margin:0; height:100vh; overflow:hidden; background:radial-gradient(circle at 20% 0%,rgba(56,189,248,.11),transparent 35rem),var(--bg); color:var(--text); font-family:Inter,system-ui,sans-serif; }
    .ide-topbar { height:64px; background:rgba(13,24,36,.94); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; padding:0 24px; }
    .ide-title { font-weight:800; }
    .ide-close { color:var(--muted); text-decoration:none; }
    .ide-close:hover { color:var(--text); }
    .ide-main { height:calc(100vh - 64px); display:grid; grid-template-columns:300px minmax(0,1fr); }
    .ide-sidebar { background:#0a1622; border-right:1px solid var(--border); overflow:auto; padding:20px 12px; }
    .explorer-title { color:var(--muted); font-size:.75rem; font-weight:800; letter-spacing:.14em; padding:0 10px 14px; }
    .file-button { width:100%; border:0; background:transparent; color:#cbd7e2; text-align:left; padding:12px 14px; border-radius:8px; cursor:pointer; font:inherit; }
    .file-button:hover, .file-button.active { background:#152536; color:#fff; }
    .file-icon { color:var(--accent); margin-right:9px; }
    .ide-content { min-width:0; overflow:auto; background:#09131e; }
    .file-header { position:sticky; top:0; z-index:2; background:#0e1b29; border-bottom:1px solid var(--border); padding:13px 24px; color:#d8e3ec; }
    .code-wrap { padding:26px; min-width:max-content; }
    pre { margin:0; color:#d6e0e8; font:14px/1.75 "Cascadia Code","Fira Code",Consolas,monospace; tab-size:4; }
    .empty { padding:40px; color:var(--muted); }
    @media (max-width:700px) { .ide-main { grid-template-columns:220px minmax(0,1fr); } .ide-sidebar { padding:12px 6px; } }
  </style>
</head>
<body>
  <div class="ide-topbar">
    <span class="ide-title">{{ page.title }}</span>
    <a class="ide-close" href="{{ '/projects/minecraft-plugin-development/' | relative_url }}">← Back to project</a>
  </div>

  <div class="ide-main">
    <aside class="ide-sidebar">
      <div class="explorer-title">EXPLORER</div>
      {% for file in page.files %}
      <button class="file-button {% if forloop.first %}active{% endif %}" type="button" data-file="{{ forloop.index0 }}">
        <span class="file-icon">▣</span>{{ file.name }}
      </button>
      {% endfor %}
    </aside>

    <section class="ide-content">
      {% for file in page.files %}
      <div class="file-panel" data-panel="{{ forloop.index0 }}" {% unless forloop.first %}hidden{% endunless %}>
        <div class="file-header">{{ file.name }}</div>
        <div class="code-wrap"><pre>{{ file.content | escape }}</pre></div>
      </div>
      {% endfor %}
      {% if page.files == nil or page.files.size == 0 %}
      <div class="empty">No files have been added to this plugin yet.</div>
      {% endif %}
    </section>
  </div>

  <script>
    document.querySelectorAll('.file-button').forEach(button => {
      button.addEventListener('click', () => {
        const id = button.dataset.file;
        document.querySelectorAll('.file-button').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.file-panel').forEach(p => p.hidden = true);
        button.classList.add('active');
        const panel = document.querySelector('[data-panel="' + id + '"]');
        if (panel) panel.hidden = false;
      });
    });
  </script>
</body>
</html>
