<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | Plugin IDE</title>
  <style>
    :root { --bg:#17191c; --panel:#202328; --panel2:#25282d; --border:#363a41; --text:#e8edf3; --muted:#9aa3ad; --accent:#7dd3fc; }
    * { box-sizing:border-box; }
    body { margin:0; height:100vh; overflow:hidden; background:var(--bg); color:var(--text); font-family:Inter,system-ui,sans-serif; }
    .ide-topbar { height:62px; background:var(--panel); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; padding:0 22px; }
    .ide-title { font-weight:750; }
    .ide-close { color:var(--muted); text-decoration:none; }
    .ide-close:hover { color:var(--text); }
    .ide-main { height:calc(100vh - 62px); display:grid; grid-template-columns:290px minmax(0,1fr); }
    .ide-sidebar { background:#1d2024; border-right:1px solid var(--border); overflow:auto; padding:18px 10px; }
    .explorer-title { color:var(--muted); font-size:.78rem; font-weight:800; letter-spacing:.12em; padding:0 10px 12px; }
    .file-button { width:100%; border:0; background:transparent; color:#cbd1d8; text-align:left; padding:11px 12px; border-radius:7px; cursor:pointer; font:inherit; }
    .file-button:hover, .file-button.active { background:#2b2f35; color:#fff; }
    .file-icon { color:var(--accent); margin-right:8px; }
    .ide-content { min-width:0; overflow:auto; background:#181a1e; }
    .file-header { position:sticky; top:0; z-index:2; background:#202328; border-bottom:1px solid var(--border); padding:12px 22px; color:#cbd1d8; }
    .code-wrap { padding:24px; min-width:max-content; }
    pre { margin:0; color:#d6dbe1; font:14px/1.7 "Cascadia Code","Fira Code",Consolas,monospace; tab-size:4; }
    .empty { padding:40px; color:var(--muted); }
    @media (max-width:700px) { .ide-main { grid-template-columns:210px minmax(0,1fr); } .ide-sidebar { padding:12px 6px; } }
  </style>
</head>
<body>
  <div class="ide-topbar">
    <span class="ide-title">{{ page.title }}</span>
    <a class="ide-close" href="{{ '/projects/' | relative_url }}">← Back to plugins</a>
  </div>

  <div class="ide-main">
    <aside class="ide-sidebar">
      <div class="explorer-title">EXPLORER</div>
      {% for file in page.files %}
      <button class="file-button {% if forloop.first %}active{% endif %}" type="button"
              data-file="{{ forloop.index0 }}">
        <span class="file-icon">▣</span>{{ file.name }}
      </button>
      {% endfor %}
    </aside>

    <section class="ide-content">
      {% for file in page.files %}
      <div class="file-panel" data-panel="{{ forloop.index0 }}" {% unless forloop.first %}hidden{% endunless %}>
        <div class="file-header">{{ file.name }}</div>
        <div class="code-wrap"><pre>{{ file.content | escape }}</pre></div>
      </div>
      {% endfor %}
      {% if page.files == nil or page.files.size == 0 %}
      <div class="empty">No files have been added to this plugin yet.</div>
      {% endif %}
    </section>
  </div>

  <script>
    document.querySelectorAll('.file-button').forEach(button => {
      button.addEventListener('click', () => {
        const id = button.dataset.file;
        document.querySelectorAll('.file-button').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.file-panel').forEach(p => p.hidden = true);
        button.classList.add('active');
        const panel = document.querySelector('[data-panel="' + id + '"]');
        if (panel) panel.hidden = false;
      });
    });
  </script>
</body>
</html>
