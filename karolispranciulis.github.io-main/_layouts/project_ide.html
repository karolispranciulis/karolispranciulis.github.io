<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ page.title }} | Code Viewer</title>
    <style>
        body { 
            margin: 0; display: flex; flex-direction: column; height: 100vh; 
            background: #1e1e1e; color: #a9b7c6; font-family: 'Consolas', monospace; 
        }
        .ide-topbar {
            background: #3c3f41; padding: 10px 20px; border-bottom: 1px solid #242424;
            display: flex; justify-content: space-between;
        }
        .ide-topbar a { color: #58a6ff; text-decoration: none; }
        .ide-main { display: flex; flex: 1; overflow: hidden; }
        .ide-sidebar {
            width: 250px; background: #3c3f41; border-right: 1px solid #242424;
            padding: 20px; overflow-y: auto; font-size: 0.9rem; line-height: 1.8;
        }
        .ide-content {
            flex: 1; background: #2b2b2b; padding: 30px; overflow-y: auto;
        }
        .ide-content h1 { color: #ffffff; margin-top: 0; }
        /* Markdown Code Blocks */
        pre { background: #1e1e1e; padding: 15px; border-radius: 6px; border: 1px solid #3c3f41; overflow-x: auto;}
    </style>
</head>
<body>
    <div class="ide-topbar">
        <span>Project: {{ page.title }}</span>
        <a href="{{ '/' | relative_url }}">⨉ Close Editor</a>
    </div>
    <div class="ide-main">
        <div class="ide-sidebar">
            <span style="color:#ffffff;">Project Explorer</span><br><br>
            📁 src<br>
            &nbsp;📁 main<br>
            &nbsp;&nbsp;📁 kotlin<br>
            &nbsp;&nbsp;📁 resources<br>
            📄 build.gradle.kts<br>
            📄 README.md
        </div>
        <div class="ide-content">
            <h1>{{ page.title }}</h1>
            {{ content }}
        </div>
    </div>
</body>
</html>
